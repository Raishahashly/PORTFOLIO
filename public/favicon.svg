<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Fiery Gradient -->
    <linearGradient id="fire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="40%" stop-color="#ff7f00" />
      <stop offset="80%" stop-color="#ffc300" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background (Optional, dark for contrast but transparent is standard. We will use a subtle dark circular background so the fire pops even on light browser tabs) -->
  <circle cx="50" cy="50" r="45" fill="#050505" stroke="#ff7f00" stroke-width="2" />

  <!-- The R (or RH) Text -->
  <text 
    x="50" 
    y="65" 
    font-family="Georgia, serif" 
    font-size="45" 
    font-weight="bold" 
    font-style="italic" 
    text-anchor="middle" 
    fill="url(#fire)" 
    filter="url(#glow)"
  >
    RH
  </text>
</svg>